# UP300 USB preset for PrusaSlicer (made from the UP Box+ USB preset)
bed_shape = -120x-100,120x-100,120x100,-120x100
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0
binary_gcode = 0
color_change_gcode = 
deretract_speed = 20
end_gcode = ; UP300 (USB) end\nG1 E-2 F1500\nM104 S0\nM140 S0\nM107\nG1 Z{min(max_layer_z + 20, max_print_height)} F600 ; lower the bed away from the part\nM84\n; the converter adds the finish beeps and powers the printer down
extruder_colour = "#FCE94F"
extruder_offset = 0x0
gcode_flavor = marlin2
inherits = 
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 300,300
machine_max_acceleration_retracting = 600,600
machine_max_acceleration_travel = 300,300
machine_max_acceleration_x = 300,300
machine_max_acceleration_y = 300,300
machine_max_acceleration_z = 500,500
machine_max_feedrate_e = 60,60
machine_max_feedrate_x = 100,100
machine_max_feedrate_y = 100,100
machine_max_feedrate_z = 30,30
machine_max_jerk_e = 5,5
machine_max_jerk_x = 8,8
machine_max_jerk_y = 8,8
machine_max_jerk_z = 0.4,0.4
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.3
max_print_height = 205
min_layer_height = 0.1
nozzle_diameter = 0.4
pause_print_gcode = 
printer_model = 
printer_notes = UP300 over USB via OpenBoxBridge. 0,0 is the middle of the bed.
printer_technology = FFF
printer_variant = 
printer_vendor = 
remaining_times = 0
retract_before_travel = 4.5
retract_before_wipe = 70%
retract_layer_change = 1
retract_length = 0.8
retract_length_toolchange = 1
retract_lift = 0
retract_restart_extra = 0
retract_speed = 25
silent_mode = 0
single_extruder_multi_material = 0
start_gcode = ; total layers = [total_layer_count]\n; UP300 (USB) start - reliability first. The printer homes itself before this runs.\n; 0,0 is the middle of the bed. The app heats the bed and waits for it before it sends the job.\n; Part cooling is the manual airflow knob on the head:\n;   PLA - airflow open; ABS - airflow closed and the door shut.\nG90\nM83\nM107\nM140 S[first_layer_bed_temperature[0]] ; keep the bed on (already hot)\n{if first_layer_bed_temperature[0] >= 80}G4 S300 ; ABS: soak the platform 5 more minutes{else}G4 S20 ; let the platform settle{endif}\nM104 S[first_layer_temperature[0]] ; heat the nozzle last so it doesn't ooze\nM109 S[first_layer_temperature[0]]\nG92 E0\nG1 Z5 F600\nG1 X-118 Y-96 F6000\nG1 Z0.3 F600\nG1 X-118 Y40 E7 F900 ; prime line, left edge\nG1 X-117.6 Y40 F900\nG1 X-117.6 Y-60 E5 F900\nG1 E-0.8 F1500\nG1 Z1 F600\nG92 E0
template_custom_gcode = 
thumbnails = 300x300/PNG
toolchange_gcode = 
travel_lift_before_obstacle = 0
travel_ramping_lift = 0
travel_slope = 0
use_firmware_retraction = 0
use_relative_e_distances = 1
use_volumetric_e = 0
wipe = 1
